<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f6" />
    <meta name="color-scheme" content="light" />
    <title>mpaios · Sign in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="bg-gray-100 min-h-[100dvh] text-gray-900 antialiased">
    <main class="max-w-md mx-auto py-10 sm:py-16 px-4">
      <header class="mb-6 text-center">
        <h1 class="text-xl sm:text-2xl font-semibold">mpaios</h1>
        <p class="text-gray-500 text-sm">Sign in to run Quick Actions</p>
      </header>

      <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-5 sm:p-6">
        <div class="flex gap-2 mb-4" role="tablist">
          <button type="button" id="tab-login" class="tab-btn flex-1 py-2 rounded-lg font-medium text-sm" aria-selected="true">Log in</button>
          <button type="button" id="tab-signup" class="tab-btn flex-1 py-2 rounded-lg font-medium text-sm" aria-selected="false">Create account</button>
        </div>

        <form id="auth-form" novalidate>
          <div class="field mb-3">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field mb-4">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required />
            <p class="text-xs text-gray-400 mt-1" id="password-hint">Minimum 8 characters.</p>
          </div>
          <button type="submit" id="submit-btn" class="btn-primary w-full">Log in</button>
          <p id="auth-error" class="hidden mt-3 text-sm text-red-700 break-words"></p>
        </form>
      </section>
    </main>

    <script src="/login.js" type="module"></script>
  </body>
</html>
